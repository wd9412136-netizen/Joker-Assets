services:
  - type: web
    name: joker-app
    env: python
    plan: free
    pythonVersion: 3.9
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 1 -b 0.0.0.0:$PORT Al-Joker:app"
    envVars:
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "8080"
      - key: GOOGLE_GEMINI_API_KEY
        sync: false